<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VibeChat - Login</title>

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >
<link rel="icon" 
type="image/png" 
href="/images/logo.png">
</head>

<body>

    <div class="container">

        <div class="login-card">

            <div class="logo">

    <img

        src="/images/logo.png"

        alt="VibeChat Logo"

    >

</div>

            <h1>VibeChat</h1>

            <p class="subtitle">

                Connect. Chat. Stay Together.

            </p>

            <form id="loginForm">

                <input
                    type="text"
                    id="loginPhone"
                    placeholder="Phone Number or Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    id="loginBtn"
                >

                    Login

                </button>

            </form>

            <p class="bottom-text">

                Don't have an account?

                <a href="/signup.html">

                    Sign Up

                </a>

            </p>

        </div>

    </div>

    <script src="/js/auth.js"></script>

</body>

</html>
