<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Clone</title>

    <link rel="stylesheet"
          href="/css/auth.css">

</head>

<body>

    <div class="container">

        <div class="login-card">

            <div class="logo">
                💬
            </div>

            <h1>WhatsApp Clone</h1>

            <p class="subtitle">
                Login to continue
            </p>

            <form id="loginForm">

                <input
                    type="text"
                    id="loginPhone"
                    placeholder="Phone Number or Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>

            <p class="bottom-text">
                Don't have an account?
                <a href="/signup.html">
                    Sign Up
                </a>
            </p>

        </div>

    </div>

    <script src="/js/auth.js"></script>

</body>

</html>
