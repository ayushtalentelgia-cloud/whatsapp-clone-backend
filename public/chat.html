<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Clone</title>

    <link rel="stylesheet" href="/css/chat.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <!-- ================= HEADER ================= -->

        <div class="sidebar-header">

            <div class="profile-section">

                <label for="profilePicInput">

                    <img
                        id="myProfilePic"
                        class="profile-pic"
                        src="https://ui-avatars.com/api/?name=User&background=38BDF8&color=fff&size=128"
                        alt="Profile"
                    >

                </label>

                <input
                    type="file"
                    id="profilePicInput"
                    accept="image/*"
                    hidden
                >

                <div>

                    <h2>Chats</h2>

                    <span id="myName">

                        Welcome

                    </span>

                </div>

            </div>

            <div class="header-icons">

                <button
                    class="icon-btn"
                    id="addContactBtn"
                >

                    <i class="fas fa-user-plus"></i>

                </button>

                <button
                    class="icon-btn"
                    id="logoutBtn"
                >

                    <i class="fas fa-right-from-bracket"></i>

                </button>

            </div>

        </div>

        <!-- ================= SEARCH ================= -->

        <div class="search-box">

            <i class="fas fa-search"></i>

            <input

                type="text"

                id="searchUser"

                placeholder="Search contacts..."

            >

        </div>

        <!-- ================= FILTERS ================= -->

        <div class="filters">

            <button class="active">

                All

            </button>

            <button>

                Unread

            </button>

            <button>

                Groups

            </button>

        </div>

        <!-- ================= CHAT LIST ================= -->

        <div

            id="chatList"

            class="chat-list"

        >

        </div>

    </div>
        <!-- ================= CHAT AREA ================= -->

    <div class="chat-section">

       <!-- ================= CHAT HEADER ================= -->

<div class="chat-header">

    <div class="chat-user">

        <button
            id="backBtn"
            class="back-btn"
        >
            <i class="fas fa-chevron-left"></i>
        </button>

        <img
            id="userAvatar"
            class="user-avatar-img"
            src="https://ui-avatars.com/api/?name=User&background=38BDF8&color=fff"
            alt="Profile"
        >

        <div class="user-details">

            <h3 id="chatName">

                Select Contact

            </h3>

            <span id="onlineStatus">

                Offline

            </span>

        </div>

    </div>

    <div class="chat-actions">

        <button id="videoCallBtn">

            <i class="fas fa-video"></i>

        </button>

        <button id="voiceCallBtn">

            <i class="fas fa-phone"></i>

        </button>

    </div>

</div>

        <!-- ================= MESSAGES ================= -->

        <div
            id="messages"
            class="messages"
        >

            <div
                id="emptyMessages"
                class="empty-chat"
            >

                <i
                    class="fas fa-comments"
                    style="font-size:70px;margin-bottom:20px;"
                ></i>

                <h2>

                    Welcome to WhatsApp Clone

                </h2>

                <p>

                    Select a contact to start chatting.

                </p>

            </div>

        </div>

        <!-- ================= MESSAGE INPUT ================= -->

        <div class="message-input">

            <button
                type="button"
                id="emojiBtn"
            >

                <i class="far fa-face-smile"></i>

            </button>

            <button
                type="button"
                id="attachmentBtn"
            >

                <i class="fas fa-paperclip"></i>

            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
            >

            <button
                id="sendBtn"
                class="send-btn"
                type="button"
            >

                <i class="fas fa-paper-plane"></i>

            </button>

        </div>

    </div>
        <!-- ================= ADD CONTACT MODAL ================= -->

    <div id="contactModal" class="contact-modal">

        <div class="contact-box">

            <h2>

                <i class="fas fa-user-plus"></i>

                Add Contact

            </h2>

            <input
                type="text"
                id="contactName"
                placeholder="Enter Contact Name"
            >

            <input
                type="text"
                id="contactPhone"
                placeholder="Enter Phone Number"
            >

            <div class="contact-buttons">

                <button id="saveContactBtn">

                    <i class="fas fa-floppy-disk"></i>

                    Save

                </button>

                <button id="closeContactBtn">

                    <i class="fas fa-xmark"></i>

                    Cancel

                </button>

            </div>

        </div>

    </div>

    <!-- ================= PROFILE MODAL ================= -->

    <div id="profileModal" class="contact-modal">

        <div class="contact-box">

            <h2>

                <i class="fas fa-user"></i>

                My Profile

            </h2>

            <div style="text-align:center;margin-bottom:20px;">

                <img
                    id="profilePreview"
                    src="https://ui-avatars.com/api/?name=User&background=38BDF8&color=fff&size=200"
                    style="
                        width:120px;
                        height:120px;
                        border-radius:50%;
                        object-fit:cover;
                        border:4px solid #38BDF8;
                    "
                >

            </div>

            <button
                id="changePhotoBtn"
                style="
                    width:100%;
                    margin-bottom:10px;
                "
            >

                <i class="fas fa-camera"></i>

                Change Profile Picture

            </button>

            <button
                id="closeProfileBtn"
                style="
                    width:100%;
                "
            >

                Close

            </button>

        </div>

    </div>

</div>

<!-- ================= SOCKET ================= -->

<script src="/socket.io/socket.io.js"></script>

<!-- ================= CHAT JS ================= -->

<script src="/js/chat.js"></script>

</body>

</html>
