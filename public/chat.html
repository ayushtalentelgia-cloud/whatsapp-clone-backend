<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VibeChat</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="/css/chat.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

          <link rel="icon" 
          type="image/png" 
          href="/images/logo.png">
</head>

<body>

<div class="app">

<!-- =========================================
     SIDEBAR
========================================= -->

<div class="sidebar">

<!-- =========================================
     PROFILE HEADER
========================================= -->

<div class="sidebar-header">

<div class="profile-section">

<img
    id="myProfilePic"
    class="profile-pic"
    src="/images/logo.png"
    alt="VibeChat Logo"
>

<div class="profile-info">

<h2 id="myName">

Loading...

</h2>

<span
    id="myAbout"
    title="Click to edit"
>
    Welcome
</span>

</div>

</div>

<div class="header-icons">

<button

id="profileBtn"

class="icon-btn"

title="Profile"

>

<i class="fa-solid fa-user"></i>

</button>

<button

id="addContactBtn"

class="icon-btn"

title="Add Contact"

>

<i class="fa-solid fa-user-plus"></i>

</button>

<button

id="menuBtn"

class="icon-btn"

title="Menu"

>

<i class="fa-solid fa-ellipsis-vertical"></i>

</button>
<div id="menuDropdown" class="menu-dropdown">

    <button id="logoutBtn">

        <i class="fas fa-right-from-bracket"></i>

        Logout

    </button>

</div>
</div>

</div>

<!-- =========================================
     SEARCH
========================================= -->

<div class="search-box">

<i class="fas fa-search"></i>

<input

type="text"

id="searchUser"

placeholder="Search contacts..."

>

</div>

<!-- =========================================
     FILTERS
========================================= -->

<div class="filters">

<button

class="active"

id="allChatsBtn"

>

All

</button>

<button

id="unreadBtn"

>

Unread

</button>

<button
id="groupBtn"
>
Groups
</button>

<button
id="statusBtn"
>
Status
</button>

</div>

<!-- =========================================
     CHAT LIST
========================================= -->

<div
id="chatList"
class="chat-list"
>

<!-- Dynamic Chats -->

</div>


<!-- =========================================
     STATUS SECTION
========================================= -->

<div
id="statusSection"
style="display:none;"
>

<div class="status-header">

<h3>Status</h3>

<button
id="addStatusBtn"
>
+ Add Status
</button>

<input
type="file"
id="statusFileInput"
accept="image/*,video/*"
style="display:none;"
>

</div>

<div
id="statusList"
>

<!-- Status items will appear here -->

</div>

</div>

<!-- =========================================
     STATUS VIEWER
========================================= -->

<div
    id="statusViewer"
    class="status-viewer"
    style="display:none;"
>

    <button
        id="closeStatusViewer"
        class="status-viewer-close"
    >
        ×
    </button>


    <div
        id="statusViewerContent"
        class="status-viewer-content"
    >
        <!-- Image / Video will appear here -->
    </div>


    <div
        id="statusViewerCaption"
        class="status-viewer-caption"
    >
    </div>

</div>
<!-- =========================================
     SIDEBAR CLOSE
========================================= -->

</div>
<!-- =========================================
     CHAT SECTION
========================================= -->

<div class="chat-section">

<!-- =========================================
     CHAT HEADER
========================================= -->

<div class="chat-header">

<button

id="backBtn"

class="back-btn"

>

<i class="fas fa-arrow-left"></i>

</button>

<div class="chat-user">

<div

id="userAvatar"

class="chat-avatar"

>

👤

</div>

<div class="chat-user-info">

<h3 id="chatName">

Select Contact

</h3>

<span id="onlineStatus">

Offline

</span>

</div>

</div>

<div class="chat-actions">

<button

id="voiceCallBtn"

title="Voice Call"

>

<i class="fas fa-phone"></i>

</button>

<button

id="videoCallBtn"

title="Video Call"

>

<i class="fas fa-video"></i>

</button>

<button

id="chatMenuBtn"

title="Menu"

>

<i class="fas fa-ellipsis-v"></i>

</button>

</div>

</div>

<!-- =========================================
     MESSAGES
========================================= -->

<div
    id="messages"
    class="messages"
>

    Welcome to VibeChat

    <br>

    Select any contact from the left sidebar
    to start chatting.

</div>


<!-- =========================================
     TYPING INDICATOR
========================================= -->

<div
    id="typingIndicator"
    class="typing-indicator"
    style="display:none"
>
    Typing...
</div>


<!-- =========================================
     INCOMING VOICE CALL
     GLOBAL MODAL
========================================= -->

<div
    id="incomingCallModal"
    class="call-modal"
    aria-hidden="true"
>

    <div
        class="call-modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="incomingCallName"
    >

        <!-- CALLER AVATAR -->

        <div
            class="call-avatar"
            id="incomingCallAvatar"
        >
            👤
        </div>


        <!-- CALLER NAME -->

        <h2 id="incomingCallName">
            Incoming Call
        </h2>


        <!-- CALL STATUS -->

        <p id="incomingCallStatus">
            Incoming voice call...
        </p>


        <!-- CALL BUTTONS -->

        <div class="call-buttons">

            <!-- REJECT -->

            <button
                id="rejectCallBtn"
                class="call-reject-btn"
                type="button"
                title="Reject Call"
                aria-label="Reject Call"
            >

                <i
                    class="fas fa-phone-slash"
                ></i>

            </button>


            <!-- ACCEPT -->

            <button
                id="acceptCallBtn"
                class="call-accept-btn"
                type="button"
                title="Accept Call"
                aria-label="Accept Call"
            >

                <i
                    class="fas fa-phone"
                ></i>

            </button>

        </div>

    </div>

</div>


<!-- =========================================
     ACTIVE VOICE CALL
========================================= -->

<div
    id="activeCallModal"
    class="call-modal"
>

    <div class="call-modal-content">

        <div
            class="call-avatar"
            id="activeCallAvatar"
        >
            👤
        </div>

        <h2 id="activeCallName">
            Calling...
        </h2>

        <p id="activeCallStatus">
            Calling...
        </p>

        <div class="active-call-buttons">

            <button
                id="muteCallBtn"
                type="button"
                title="Mute"
            >

                <i class="fas fa-microphone"></i>

            </button>

            <button
                id="endCallBtn"
                class="end-call-btn"
                type="button"
                title="End Call"
            >

                <i class="fas fa-phone-slash"></i>

            </button>

        </div>

    </div>

</div>


<!-- =========================================
     REMOTE AUDIO
========================================= -->

<audio
    id="remoteAudio"
    autoplay
></audio>
<!-- =========================================
     MESSAGE INPUT
========================================= -->

<div class="message-input">

    <!-- Emoji -->

    <button id="emojiBtn" type="button">

        <i class="far fa-face-smile"></i>

    </button>

    <!-- Attachment -->

    <button id="attachmentBtn" type="button">

        <i class="fas fa-paperclip"></i>

    </button>

    <!-- Hidden File Input -->

    <input

        type="file"

        id="fileInput"

        hidden

        accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.zip"

    >

    <!-- Message -->

    <input

        type="text"

        id="messageInput"

        placeholder="Type a message..."

        autocomplete="off"

    >

    <!-- Send -->

    <button

        id="sendBtn"

        class="send-btn"

        type="button"

    >

        <i class="fas fa-paper-plane"></i>

    </button>

</div>

<!-- =========================================
     EMOJI PICKER
========================================= -->

<div id="emojiContainer" class="emoji-container">

    <emoji-picker></emoji-picker>

</div>

</div>

<!-- =========================================
     ADD CONTACT MODAL
========================================= -->

<div id="contactModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>

                Add Contact

            </h2>

            <button id="closeContactBtn">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div class="modal-body">

            <input

                type="text"

                id="contactName"

                placeholder="Contact Name"

            >

            <input

                type="text"

                id="contactPhone"

                placeholder="Phone Number"

            >

            <button id="saveContactBtn">

                <i class="fas fa-save"></i>

                Save Contact

            </button>

        </div>

    </div>

</div>

<!-- =========================================
     PROFILE MODAL
========================================= -->

<div id="profileModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>

                My Profile

            </h2>

            <button id="closeProfileBtn">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div class="modal-body profile-body">

            <img

                id="profilePreview"

                class="profile-preview"

                src="https://ui-avatars.com/api/?name=User"

                alt="Profile"

            >

            <input

                type="file"

                id="profilePicInput"

                accept="image/*"

                hidden

            >

            <button id="changePhotoBtn">

                <i class="fas fa-camera"></i>

                Change Photo

            </button>

            <div class="profile-details">

                <h3 id="profileName">

                    Loading...

                </h3>

                <p id="profilePhone">

                    Phone

                </p>

                <p id="profileEmail">

                    Email

                </p>

            </div>

        </div>

    </div>

</div>

<!-- =========================================
     EDIT ABOUT MODAL
========================================= -->

<div
    id="aboutModal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Edit About
            </h2>

            <button
                id="closeAboutBtn"
                type="button"
            >
                <i class="fas fa-times"></i>
            </button>

        </div>

        <div class="modal-body">

            <input
                type="text"
                id="aboutInput"
                maxlength="100"
                placeholder="Write something about yourself..."
            >

            <button
                id="saveAboutBtn"
                type="button"
            >
                <i class="fas fa-save"></i>
                Save
            </button>

        </div>

    </div>

</div>
<!-- =========================================
     LOGOUT MENU
========================================= -->

<!--///<div id="menuDropdown" class="menu-dropdown">

   /// <button id="logoutBtn">

       /// <i class="fas fa-right-from-bracket"></i>

      ///  Logout

    ///</button>

///</div>-->

<!-- =========================================
     MESSAGE MENU
========================================= -->

<div id="messageContextMenu" class="message-context-menu">

    <button id="editMessageBtn">

        <i class="fas fa-pen"></i>

        Edit

    </button>

    <button id="deleteMessageBtn">

        <i class="fas fa-trash"></i>

        Delete

    </button>

</div>

<!-- =========================================
     SOCKET
========================================= -->

<script src="/socket.io/socket.io.js"></script>

<!-- =========================================
     CHAT SCRIPT
========================================= -->

<script src="/js/chat.js"></script>

<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
</body>

</html>
<!-- =========================================
     PROFILE IMAGE VIEWER
========================================= -->

<div id="imageViewer" class="image-viewer">

    <button
        type="button"
        id="closeImageViewer"
        class="image-viewer-close"
    >
        ×
    </button>

    <img
        id="imageViewerImg"
        src=""
        alt="Profile Image"
    >

</div>
