<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Clone</title>

    <link rel="stylesheet" href="/css/chat.css">

</head>

<body>

    <div class="app">

        <!-- ================= LEFT SIDEBAR ================= -->

        <div class="sidebar">

            <div class="sidebar-header">

                <h2>WhatsApp</h2>

                <button id="logoutBtn">
                    Logout
                </button>

            </div>

            <!-- Search User -->

            <div class="search">

                <input
                    type="text"
                    id="searchPhone"
                    placeholder="Enter Phone Number"
                >

                <button id="createChatBtn">
                    Start Chat
                </button>

            </div>

            <!-- Chat List -->

            <div id="chatList">

            </div>

        </div>

        <!-- ================= RIGHT SIDE ================= -->

        <div class="chat-area">

            <!-- Header -->

            <div class="chat-header">

                <div class="user-info">

                    <div class="avatar" id="userAvatar">

                        👤

                    </div>

                    <div>

                        <h3 id="chatName">

                            Select Chat

                        </h3>

                        <small id="onlineStatus">

                            Offline

                        </small>

                    </div>

                </div>

            </div>

            <!-- Messages -->

            <div
                class="messages"
                id="messages"
            >

            </div>

            <!-- Message Box -->

            <div class="message-box">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                >

                <button id="sendBtn">

                    Send

                </button>

            </div>

        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="/js/chat.js"></script>

</body>

</html>
