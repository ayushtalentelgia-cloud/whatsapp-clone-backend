<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clone - Sign Up</title>

    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

    <div class="container">

        <div class="login-card">

            <div class="logo">
                💬
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join WhatsApp Clone
            </p>

            <form id="signupForm">

                <input
                    type="text"
                    id="signupName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="signupPhone"
                    placeholder="Phone Number"
                    required
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    id="signupBtn"
                >
                    Create Account
                </button>

            </form>

            <p class="bottom-text">
                Already have an account?
                <a href="/index.html">
                    Login
                </a>
            </p>

        </div>

    </div>

    <script src="/js/auth.js"></script>

</body>

</html>
