<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VibeChat - Sign Up</title>

    <link rel="stylesheet" href="/css/auth.css">
<link rel="icon" 
type="image/png" 
href="/images/logo.png">
</head>

<body>

    <div class="container">

        <div class="login-card">

           <div class="logo">

    <img

        src="/images/logo.png"

        alt="VibeChat Logo"

    >

</div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join the Conversation 🚀
            </p>

            <form id="signupForm">

                <input
                    type="text"
                    id="signupName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="text"
                    id="signupPhone"
                    placeholder="Phone Number"
                    required
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    id="signupBtn"
                >
                    Create Account
                </button>

            </form>

            <p class="bottom-text">

                Already have an account?

                <a href="/index.html">

                    Login

                </a>

            </p>

        </div>

    </div>

    <script src="/js/auth.js"></script>

</body>

</html>
