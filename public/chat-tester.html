<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat Tester</title>

    
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#111b21;
            color:white;
            height:100vh;
            overflow:hidden;
        }

        .container{
            display:flex;
            height:100vh;
        }

        /* ================= LEFT PANEL ================= */

        .left-panel{
            width:340px;
            background:#202c33;
            border-right:1px solid #2f3b43;
            display:flex;
            flex-direction:column;
        }

        .logo{
            padding:20px;
            font-size:28px;
            font-weight:bold;
            color:#25D366;
            text-align:center;
            border-bottom:1px solid #2f3b43;
        }

        .section{
            padding:15px;
            border-bottom:1px solid #2f3b43;
        }

        .section h3{
            margin-bottom:10px;
            color:#25D366;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:10px;
            border:none;
            outline:none;
            border-radius:6px;
            background:#2a3942;
            color:white;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            background:#25D366;
            color:white;
            font-weight:bold;
            margin-bottom:10px;
        }

        button:hover{
            background:#20ba5a;
        }

        #chatList{
            flex:1;
            overflow:auto;
        }

        .chat-item{
            padding:15px;
            border-bottom:1px solid #2f3b43;
            cursor:pointer;
        }

        .chat-item:hover{
            background:#2a3942;
        }

        .chat-name{
            font-weight:bold;
        }

        .chat-last{
            color:#bbb;
            font-size:13px;
            margin-top:5px;
        }

        /* ================= RIGHT PANEL ================= */

        .right-panel{
            flex:1;
            display:flex;
            flex-direction:column;
            background:#0b141a;
        }

        .chat-header{
            height:70px;
            background:#202c33;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 20px;
            border-bottom:1px solid #2f3b43;
        }

        .chat-header h2{
            font-size:22px;
        }

        #onlineStatus{
            color:#25D366;
            font-weight:bold;
        }

        #typingStatus{
            padding:10px 20px;
            color:#25D366;
            font-size:14px;
            min-height:25px;
        }

        #messages{
            flex:1;
            overflow:auto;
            padding:20px;
        }

        .message{
            max-width:70%;
            padding:12px;
            margin-bottom:12px;
            border-radius:8px;
            word-wrap:break-word;
        }

        .me{
            margin-left:auto;
            background:#005c4b;
        }

        .other{
            background:#202c33;
        }

        .message-footer{
            margin-top:8px;
            text-align:right;
            font-size:13px;
            color:#ddd;
        }

        .chat-footer{
            display:flex;
            padding:15px;
            background:#202c33;
        }

        #messageInput{
            flex:1;
            margin-right:10px;
            margin-bottom:0;
        }

        #sendBtn{
            width:140px;
            margin-bottom:0;
        }

        /* ================= LOG ================= */

        .logs{
            height:180px;
            background:black;
            color:#00ff00;
            overflow:auto;
            padding:10px;
            font-size:13px;
            border-top:1px solid #2f3b43;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- ================= LEFT ================= -->

    <div class="left-panel">

        <div class="logo">
            WhatsApp Tester
        </div>

        <div class="section">

            <h3>Register</h3>

            <input id="registerName" placeholder="Name">

            <input id="registerEmail" placeholder="Email">

            <input id="registerPassword" type="password" placeholder="Password">

            <button id="registerBtn">
                Register
            </button>

        </div>

        <div class="section">

            <h3>Login</h3>

            <input id="loginEmail" placeholder="Email">

            <input id="loginPassword" type="password" placeholder="Password">

            <button id="loginBtn">
                Login
            </button>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

        <div class="section">

            <h3>Create Chat</h3>

            <input id="receiverId" placeholder="Receiver User ID">

            <button id="createChatBtn">
                Create Chat
            </button>

        </div>

        <div id="chatList">

        </div>

    </div>

    <!-- ================= RIGHT ================= -->

    <div class="right-panel">

        <div class="chat-header">

            <h2 id="chatTitle">
                No Chat Selected
            </h2>

            <span id="onlineStatus">
                Offline
            </span>

        </div>

        <div id="typingStatus">

        </div>

        <div id="messages">

        </div>

        <div class="chat-footer">

            <input
                id="messageInput"
                placeholder="Type Message..."
            >

            <button id="sendBtn">
                Send
            </button>

        </div>

        <div id="logs" class="logs">

            WhatsApp Chat Tester Started...

        </div>

    </div>

</div>

<!-- Socket.IO -->
<script src="/socket.io/socket.io.js"></script>

<!-- JavaScript will start from Part 2 -->
<script>

const API_URL = "https://whatsapp-clone-backend-b5o7.onrender.com/api";

let token = "";
let currentUser = null;
let currentChat = null;
let socket = null;

// ================= LOGGER =================

function log(message) {

    const logs = document.getElementById("logs");

    logs.innerHTML += "<br>" + message;

    logs.scrollTop = logs.scrollHeight;

}
// ================= SOCKET =================

function connectSocket() {

   socket = io("https://whatsapp-clone-backend-b5o7.onrender.com");

    // ================= CONNECT =================

    socket.on("connect", () => {

        console.log("🟢 Socket Connected");

        log("🟢 Socket Connected");

    });

    // ================= DISCONNECT =================

    socket.on("disconnect", () => {

        console.log("🔴 Socket Disconnected");

        log("🔴 Socket Disconnected");

    });

    // ================= SETUP COMPLETE =================

    socket.on("connected", () => {

        console.log("✅ Setup Completed");

    });

    // ================= RECEIVE MESSAGE =================

    socket.on("message received", async (newMessage) => {

        console.log("📩 New Message Received :", newMessage);

        if (
            currentChat &&
            newMessage.chat &&
            newMessage.chat._id.toString() === currentChat._id.toString()
        ) {

            await loadMessages(currentChat._id);

        }

        log("📩 New Message Received");

    });

    // ================= MESSAGE DELIVERED =================

    socket.on("message delivered", async (message) => {

        console.log("✅ Message Delivered :", message);

        if (currentChat) {

            await loadMessages(currentChat._id);

        }

    });

    // ================= MESSAGE SEEN =================

    socket.on("message seen", async (message) => {

        console.log("👀 Message Seen :", message);

        if (currentChat) {

            await loadMessages(currentChat._id);

        }

    });

// ================= TYPING =================

socket.on("typing", () => {

    console.log("📢 Typing Received");

    document.getElementById("typingStatus").innerHTML = "✍️ Typing...";

});

socket.on("stop typing", () => {

    console.log("📢 Stop Typing Received");

    document.getElementById("typingStatus").innerHTML = "";

});
}

// ================= AUTO LOGIN =================

window.onload = () => {

    token = localStorage.getItem("token");

    const user = localStorage.getItem("user");

    if (!token || !user) {

        log("⚠ Please Login");
        return;

    }

    currentUser = JSON.parse(user);

    connectSocket();

    socket.on("connect", () => {

        socket.emit("setup", currentUser);

        document.getElementById("onlineStatus").innerHTML = "🟢 Online";

        log("🟢 Auto Login Successful");

        loadChats();

    });

};
// ================= REGISTER =================

document.getElementById("registerBtn").onclick = async () => {

    const name = document.getElementById("registerName").value;

    const phone = document.getElementById("registerEmail").value;

    const password = document.getElementById("registerPassword").value;

    try {

        const res = await fetch(API_URL + "/users/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
            },

            body: JSON.stringify({
                name,
                phone,
                email: phone + "@chat.com",
                password,
            }),

        });

        const data = await res.json();

        if (data.success) {

            log("✅ Registration Successful");

        } else {

            log("❌ " + data.message);

        }

    } catch (err) {

        log("❌ " + err.message);

    }

};
// ================= LOGIN =================

// ================= LOGIN =================

document.getElementById("loginBtn").onclick = async () => {

    const email = document.getElementById("loginEmail").value;

    const password = document.getElementById("loginPassword").value;

    try {

        const res = await fetch(API_URL + "/users/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email,
                password
            })

        });

        const data = await res.json();

        if (!data.success) {

            log("❌ " + data.message);

            return;

        }

        // Save Token
        token = data.token;

        localStorage.setItem("token", token);

        currentUser = data.user;

        localStorage.setItem("user", JSON.stringify(data.user));

        log("✅ Login Successful");

        // Socket Connect
        connectSocket();

socket.on("connect", async () => {

    socket.emit("setup", currentUser);

    document.getElementById("onlineStatus").innerHTML = "🟢 Online";

    log("🟢 User Connected");

    await loadChats();

});

    }
    catch (err) {

        log("❌ " + err.message);

    }

};

// ================= LOGOUT =================

document.getElementById("logoutBtn").onclick = () => {

    localStorage.removeItem("token");

    localStorage.removeItem("user");

    token = "";
    currentUser = null;
    currentChat = null;

    if (socket) {

        socket.disconnect();

        socket = null;

    }

    document.getElementById("onlineStatus").innerHTML = "🔴 Offline";

    log("👋 Logged Out");

};
// ================= CREATE CHAT =================

document.getElementById("createChatBtn").onclick = async () => {

    const receiverId = document.getElementById("receiverId").value;

    if (!receiverId) {

        log("❌ Receiver User ID Required");

        return;

    }

    try {

        const res = await fetch(API_URL + "/chat", {

            method: "POST",

            headers: {

                "Content-Type": "application/json",

                Authorization: "Bearer " + token

            },

            body: JSON.stringify({

                userId: receiverId

            })

        });

        const data = await res.json();

        if (!data.success) {

            log("❌ " + data.message);

            return;

        }

        log("✅ Chat Created");

        loadChats();

    }
    catch (err) {

        log("❌ " + err.message);

    }

};

// ================= LOAD CHATS =================

async function loadChats() {

    try {

        const res = await fetch(API_URL + "/chat", {

            method: "GET",

            headers: {
                Authorization: "Bearer " + token
            }

        });

        const data = await res.json();

        if (!data.success) {

            log("❌ " + data.message);
            return;

        }

        log("✅ Chats Loaded");

        const chatList = document.getElementById("chatList");

        chatList.innerHTML = "";

        data.chats.forEach(chat => {

            // Find Other User
            const otherUser = chat.users.find(
                user => user._id.toString() !== currentUser._id.toString()
            );

            const div = document.createElement("div");

            div.className = "chat-item";

            div.innerHTML = `
                <div class="chat-name">
                    ${otherUser ? otherUser.name : "Unknown User"}
                </div>

                <div class="chat-last">
                    ${chat.latestMessage ? chat.latestMessage.content : "No Messages"}
                </div>
            `;

            div.onclick = async () => {

                console.log("CHAT CLICKED");

                currentChat = chat;

                // Update Chat Title
                document.getElementById("chatTitle").innerHTML =
                    otherUser ? otherUser.name : "Unknown User";

                // Join Socket Room
                if (socket) {
                    socket.emit("join chat", chat._id);
                }

                try {

                    await loadMessages(chat._id);

                    log("💬 Chat Selected");

                } catch (err) {

                    console.error("LOAD MESSAGE ERROR :", err);

                    log("❌ Load Message Failed");

                }

            };

            chatList.appendChild(div);

        });

    }
    catch (err) {

        console.error(err);

        log("❌ " + err.message);

    }

}
// ================= LOAD MESSAGES =================

async function loadMessages(chatId) {

    try {

        console.log("Loading Messages For Chat:", chatId);

        const res = await fetch(API_URL + "/message/" + chatId, {

            method: "GET",

            headers: {
                Authorization: "Bearer " + token
            }

        });

        const data = await res.json();

        console.log("Response:", data);

        if (!data.success) {

            log("❌ " + data.message);

            return;

        }

        const messages = document.getElementById("messages");

        messages.innerHTML = "";

        console.log("Messages:", data.messages);

        if (data.messages.length === 0) {

            messages.innerHTML = `
                <div style="color:#bbb;text-align:center;margin-top:30px;">
                    No Messages Yet
                </div>
            `;

            log("📭 No Messages");

            return;

        }

        data.messages.forEach(msg => {

            console.log("Message:", msg);

            // ================= MESSAGE DELIVERED =================

            if (
                msg.sender._id.toString() !== currentUser._id.toString() &&
                !msg.delivered
            ) {

                socket.emit("message delivered", {
                    messageId: msg._id
                });

            }

            // ================= MESSAGE SEEN =================

            if (
                msg.sender._id.toString() !== currentUser._id.toString() &&
                !msg.seen
            ) {

                socket.emit("message seen", {
                    messageId: msg._id,
                    userId: currentUser._id
                });

            }

            const div = document.createElement("div");

            div.className =
                "message " +
                (msg.sender._id.toString() === currentUser._id.toString()
                    ? "me"
                    : "other");

            const messageTime = new Date(msg.createdAt).toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });

            div.innerHTML = `

                <div class="message-text">
                    ${msg.content}
                </div>

                <div class="message-meta">

                    <span class="message-time">
                        ${messageTime}
                    </span>

                    ${
                        msg.sender._id.toString() === currentUser._id.toString()
                        ? `
                            <span class="message-footer">
                                ${
                                    msg.seen
                                        ? `<span class="seen">✔✔</span>`
                                        : msg.delivered
                                        ? "✔✔"
                                        : "✔"
                                }
                            </span>
                        `
                        : ""
                    }

                </div>

            `;

            messages.appendChild(div);

        });

        messages.scrollTop = messages.scrollHeight;

        log("✅ Messages Loaded");

    }
    catch (err) {

        console.error("LOAD MESSAGE ERROR:", err);

        log("❌ " + err.message);

    }

}

// ================= TYPING =================

let typing = false;

let typingTimeout;

document.getElementById("messageInput").addEventListener("input", () => {

    console.log("⌨ Typing Event Sent");

    if (!currentChat) return;

    if (!typing) {

        typing = true;

        socket.emit("typing", currentChat._id);

    }

    clearTimeout(typingTimeout);

    typingTimeout = setTimeout(() => {

        typing = false;

        socket.emit("stop typing", currentChat._id);

    }, 1000);

});
// ================= SEND MESSAGE =================

document.getElementById("sendBtn").onclick = async () => {

    if (!currentChat) {

        log("❌ Please Select A Chat");

        return;

    }

    const content = document.getElementById("messageInput").value.trim();

    if (!content) {

        log("❌ Enter Message");

        return;

    }

    try {

        const res = await fetch(API_URL + "/message", {

            method: "POST",

            headers: {

                "Content-Type": "application/json",

                Authorization: "Bearer " + token

            },

            body: JSON.stringify({

                content,
                chatId: currentChat._id

            })

        });

        const data = await res.json();

        if (!data.success) {

            log("❌ " + data.message);

            return;

        }

        document.getElementById("messageInput").value = "";

        socket.emit("stop typing", currentChat._id);

        await loadMessages(currentChat._id);

        log("📩 Message Sent");

    }
    catch (err) {

        console.error(err);

        log("❌ " + err.message);

    }

};

</script>
</body>
</html>
